<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="1">
    <path d="M 0 60 H 800 M 0 120 H 800 M 0 180 H 800 M 0 240 H 800 M 0 300 H 800 M 0 360 H 800" />
    <path d="M 100 0 V 420 M 200 0 V 420 M 300 0 V 420 M 400 0 V 420 M 500 0 V 420 M 600 0 V 420 M 700 0 V 420" />
  </g>

  <!-- Top Title / Header -->
  <text x="40" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">SYSTEM ARCHITECTURE</text>
  <text x="40" y="70" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Portfolio &amp; MDX Content Pipeline</text>

  <!-- 3 Main Columns / Cards -->

  <!-- 1. Content Layer (Velite) -->
  <g transform="translate(40, 105)" filter="url(#shadow)">
    <rect width="215" height="265" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
    <rect x="0" y="0" width="215" height="4" rx="2" fill="url(#accentPurple)" />
    <text x="20" y="32" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LAYER 01</text>
    <text x="20" y="55" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Content / Velite</text>
    
    <g transform="translate(20, 75)" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">
      <!-- Item 1 -->
      <rect x="0" y="0" width="175" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" fill="#e2e8f0" font-weight="500">📝 MDX Markdown</text>
      <!-- Item 2 -->
      <rect x="0" y="48" width="175" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="72" fill="#e2e8f0" font-weight="500">🔒 Zod Type Validation</text>
      <!-- Item 3 -->
      <rect x="0" y="96" width="175" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="120" fill="#e2e8f0" font-weight="500">🎨 Shiki Syntax Highlighting</text>
      <!-- Item 4 -->
      <rect x="0" y="144" width="175" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="168" fill="#e2e8f0" font-weight="500">📑 Auto TOC &amp; Slugify</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g stroke="url(#accentBlue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 265 235 H 285" />
    <polyline points="280 230 286 235 280 240" />
  </g>

  <!-- 2. Application Layer (Next.js 16) -->
  <g transform="translate(292, 105)" filter="url(#shadow)">
    <rect width="215" height="265" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
    <rect x="0" y="0" width="215" height="4" rx="2" fill="url(#accentBlue)" />
    <text x="20" y="32" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LAYER 02</text>
    <text x="20" y="55" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Next.js 16 App Router</text>
    
    <g transform="translate(20, 75)" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">
      <rect x="0" y="0" width="175" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" fill="#e2e8f0" font-weight="500">⚡ Server Components</text>
      <rect x="0" y="48" width="175" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="72" fill="#e2e8f0" font-weight="500">💨 Turbopack Engine</text>
      <rect x="0" y="96" width="175" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="120" fill="#e2e8f0" font-weight="500">🎨 Tailwind CSS v4</text>
      <rect x="0" y="144" width="175" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="168" fill="#e2e8f0" font-weight="500">🖼️ Dynamic OG Images</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g stroke="url(#accentGreen)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 517 235 H 537" />
    <polyline points="532 230 538 235 532 240" />
  </g>

  <!-- 3. Output Layer (Edge Deployment) -->
  <g transform="translate(545, 105)" filter="url(#shadow)">
    <rect width="215" height="265" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
    <rect x="0" y="0" width="215" height="4" rx="2" fill="url(#accentGreen)" />
    <text x="20" y="32" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LAYER 03</text>
    <text x="20" y="55" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Distribution &amp; SEO</text>
    
    <g transform="translate(20, 75)" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">
      <rect x="0" y="0" width="175" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" fill="#e2e8f0" font-weight="500">🌍 Vercel Global Edge</text>
      <rect x="0" y="48" width="175" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="72" fill="#e2e8f0" font-weight="500">🗺️ Auto sitemap.xml</text>
      <rect x="0" y="96" width="175" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="120" fill="#e2e8f0" font-weight="500">📡 RSS 2.0 Feed</text>
      <rect x="0" y="144" width="175" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="168" fill="#e2e8f0" font-weight="500">⚡ 100/100 Lighthouse</text>
    </g>
  </g>
</svg>
