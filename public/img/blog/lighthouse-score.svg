<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="scoreBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="240" rx="16" fill="url(#scoreBg)" />
  <rect x="0.5" y="0.5" width="799" height="239" rx="15.5" fill="none" stroke="#334155" stroke-width="1" />

  <text x="40" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">LIGHTHOUSE AUDIT</text>
  <text x="40" y="58" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Production Build Metrics (Mobile &amp; Desktop)</text>

  <!-- 4 circular scores -->
  <!-- 1. Performance -->
  <g transform="translate(100, 140)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="#1e293b" stroke-width="6" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="264" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90)" />
    <text x="0" y="8" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" text-anchor="middle">100</text>
    <text x="0" y="66" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Performance</text>
  </g>

  <!-- 2. Accessibility -->
  <g transform="translate(300, 140)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="#1e293b" stroke-width="6" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="264" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90)" />
    <text x="0" y="8" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" text-anchor="middle">100</text>
    <text x="0" y="66" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Accessibility</text>
  </g>

  <!-- 3. Best Practices -->
  <g transform="translate(500, 140)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="#1e293b" stroke-width="6" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="264" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90)" />
    <text x="0" y="8" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" text-anchor="middle">100</text>
    <text x="0" y="66" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Best Practices</text>
  </g>

  <!-- 4. SEO -->
  <g transform="translate(700, 140)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="#1e293b" stroke-width="6" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="264" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90)" />
    <text x="0" y="8" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" text-anchor="middle">100</text>
    <text x="0" y="66" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">SEO</text>
  </g>
</svg>
